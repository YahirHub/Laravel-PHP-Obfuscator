name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "This release workflow must be run from main." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test pure-Go library and CLI
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          latest_num=0
          while IFS= read -r existing; do
            if [[ "$existing" =~ ^v0\.([0-9]+)$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))
              if (( n > latest_num )); then
                latest_num=$n
              fi
            fi
          done < <(git tag --list 'v0.*')

          next=$((latest_num + 1))
          tag="v0.${next}"
          module_tag="v0.${next}.0"
          version="0.${next}"

          for candidate in "$tag" "$module_tag"; do
            if git rev-parse "$candidate" >/dev/null 2>&1; then
              echo "Tag already exists: $candidate" >&2
              exit 1
            fi
          done

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "module_tag=$module_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag (Go module alias: $module_tag)"

      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local os="$1"
            local arch="$2"
            local ext="$3"
            local output="dist/phpcloak-${os}-${arch}-${TAG}${ext}"

            echo "Building ${output}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION} -X github.com/YahirHub/Laravel-PHP-Obfuscator.Version=${VERSION}" \
                -o "$output" ./cmd/phpcloak
          }

          build windows amd64 .exe
          build windows arm64 .exe
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""

          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Verify built version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          actual="$(./dist/phpcloak-linux-amd64-${TAG} version)"
          expected="phpcloak ${VERSION}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version mismatch. Expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "phpcloak $TAG" \
            --generate-notes

      - name: Create Go module SemVer alias
        env:
          MODULE_TAG: ${{ steps.version.outputs.module_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$MODULE_TAG" "$GITHUB_SHA"
          git push origin "$MODULE_TAG"
