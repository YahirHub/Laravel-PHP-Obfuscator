name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "This release workflow must be run from main." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          latest="$(git tag --list 'v0.*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            next=1
          else
            minor="${latest#v0.}"
            if [[ ! "$minor" =~ ^[0-9]+$ ]]; then
              echo "Unexpected tag format: $latest" >&2
              exit 1
            fi
            next=$((10#$minor + 1))
          fi

          tag="v0.${next}"
          version="0.${next}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local os="$1"
            local arch="$2"
            local ext="$3"
            local output="dist/phpcloak-${os}-${arch}-${TAG}${ext}"

            echo "Building ${output}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$output" .
          }

          build windows amd64 .exe
          build windows arm64 .exe
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""

          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Verify built version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          actual="$(./dist/phpcloak-linux-amd64-${TAG} version)"
          expected="phpcloak ${VERSION}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Version mismatch. Expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "phpcloak $TAG" \
            --generate-notes
